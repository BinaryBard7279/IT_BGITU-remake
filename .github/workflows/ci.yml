name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # === ЭТАП 1: ТЕСТИРОВАНИЕ И ЛИНТИНГ (Твои новые крутые тесты) ===
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff (Линтер)
        run: ruff check .
      - name: Run Pytest (Тестирование API и БД)
        env:
          PYTHONPATH: .  
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: dummy_ci_secret_key
          ENABLE_PERF_LOGGING: False
        run: pytest -v

  # === ЭТАП 2: СБОРКА И ОТПРАВКА В DOCKER HUB (Из старого файла) ===
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: binarybard7279/it-bgitu:latest

  # === ЭТАП 3: ОБНОВЛЕНИЕ КОНФИГОВ НА СЕРВЕРЕ ===
  update-configs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy config files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          # Копируем нужные файлы на сервер
          source: "docker-compose.yml,Caddyfile"
          target: "/root/it-bgitu"

  # === ЭТАП 4: ДЕПЛОЙ (Перезапуск готового образа) ===
  deploy:
    needs: update-configs
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /root/it-bgitu
            
            # 1. Записываем переменные окружения
            echo "DB_USER=${{ secrets.DB_USER }}" > .env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_HOST=db" >> .env
            echo "DB_PORT=5432" >> .env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
            
            # 2. Скачиваем новый образ и запускаем
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Применяем миграции
            sleep 5
            docker compose exec -T app alembic upgrade head
            
            # 4. Чистим старые образы, чтобы не забивать память сервера
            docker image prune -f 
            print(egawweb;rnboqq)