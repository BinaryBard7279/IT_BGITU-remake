name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # === ЭТАП 1: ТЕСТИРОВАНИЕ И ЛИНТИНГ ===
  test:
    runs-on: ubuntu-latest
    
    # Поднимаем временный PostgreSQL прямо внутри GitHub Actions
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (Линтер и Форматер)
        run: ruff check .

      - name: Run Pytest (Тестирование API и БД)
        env:
          PYTHONPATH: .  
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: dummy_ci_secret_key
          ENABLE_PERF_LOGGING: False
        run: pytest -v

  # === ЭТАП 2: ДЕПЛОЙ НА ПРОД ===
  deploy:
    needs: test # ВАЖНО: Ждет успешного завершения job "test"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/it-bgitu
            git pull origin main
            docker compose down
            docker compose up -d --build