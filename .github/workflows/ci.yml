name: Deploy IT_BGITU

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Проверка кода (защита от дурака)
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: |
          # Создаем временную SQLite базу для проверки схемы
          export DATABASE_URL="sqlite:///./check.db"
          # alembic check работает начиная с версии 1.9.0
          alembic check || echo "⚠️ ВНИМАНИЕ: Похоже, вы забыли создать миграцию! (Или alembic check не поддерживается, пропускаем)"

  build-and-push:
    needs: check-code  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: binarybard7279/it-bgitu:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /root/it-bgitu
            
            # Обновляем .env
            echo "DB_USER=${{ secrets.DB_USER }}" > .env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_HOST=db" >> .env
            echo "DB_PORT=5432" >> .env
            
            # Деплой
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Миграции
            sleep 5
            docker compose exec -T app alembic upgrade head
            
            docker image prune -f
