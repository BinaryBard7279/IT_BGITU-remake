version: '3.8'

services:
  app:
    image: binarybard7279/it-bgitu:latest
    restart: always
    expose:
      - "8000"
    env_file:
      - .env  # <-- Это будет .env на сервере, созданный из secrets
    depends_on:
      - db
    # --- ВАЖНОЕ ИЗМЕНЕНИЕ: Сохраняем картинки на диск ---
    volumes:
      - media_data:/code/app/uploads
    # ----------------------------------------------------
    networks:
      - itnet

# docker-compose.yml
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      # Добавляем доступы к папкам приложения
      - ./app/static:/code/app/static:ro 
      - media_data:/code/app/uploads:ro
# ...

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER} # Читает из .env на сервере
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itnet

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: StrongPass123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - itnet

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  pgadmin_data:
  media_data: # <-- Создаем хранилище для картинок

networks:
  itnet:
    driver: bridge